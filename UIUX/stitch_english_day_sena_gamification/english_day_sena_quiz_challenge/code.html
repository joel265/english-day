<script>
  // Simple playful micro-interaction for Kahoot answer buttons
  function selectAnswer(btn, isCorrect) {
    if (isCorrect) {
      btn.classList.add('scale-105');
      const timerText = document.getElementById('timer-text');
      if (timerText) timerText.innerText = '¡Correcto! +100 XP';
    } else {
      btn.classList.add('opacity-70');
    }
  }

  // Word chip placement toggle
  function selectChip(chip) {
    const target = document.getElementById('dropped-word');
    if (target) {
      target.textContent = chip.textContent.trim();
    }
  }

  // Live countdown micro-timer simulator
  let seconds = 8;
  const timerElem = document.getElementById('timer-text');
  const timerProgress = document.getElementById('timer-progress');
  if (timerElem && timerProgress) {
    const interval = setInterval(() => {
      if (seconds > 1) {
        seconds--;
        timerElem.innerText = `0${seconds}s`;
        timerProgress.style.width = `${(seconds / 8) * 80}%`;
      } else {
        timerElem.innerText = '¡Tiempo!';
        timerProgress.style.width = '0%';
        clearInterval(interval);
      }
    }, 1000);
  }
</script></main>
