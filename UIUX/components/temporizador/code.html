<!DOCTYPE html><html lang="en" style="width: 390px; height: 884px; overflow: hidden; position: relative;"><svg class="inline-defs-container" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#2b6c00", "on-surface": "#111d22", "background": "#f3faff", "on-tertiary": "#ffffff", "inverse-primary": "#6be026", "inverse-surface": "#263237", "surface-container-lowest": "#ffffff", "on-primary-container": "#1e5000", "tertiary-container": "#ddad00", "on-primary": "#ffffff", "primary-fixed-dim": "#6be026", "primary": "#2b6c00", "surface-container-low": "#e9f6fd", "on-tertiary-fixed": "#241a00", "on-error": "#ffffff", "surface-container": "#e3f0f7", "surface-dim": "#cfdce3", "on-secondary-fixed-variant": "#004c6e", "secondary-container": "#2fb8ff", "secondary-fixed-dim": "#88ceff", "on-tertiary-fixed-variant": "#594400", "tertiary-fixed-dim": "#f4bf00", "surface-bright": "#f3faff", "on-error-container": "#93000a", "inverse-on-surface": "#e6f3fa", "tertiary": "#755b00", "surface-container-highest": "#d7e5eb", "error-container": "#ffdad6", "on-tertiary-container": "#574300", "on-background": "#111d22", "secondary-fixed": "#c8e6ff", "on-surface-variant": "#3f4a36", "surface-variant": "#d7e5eb", "on-primary-fixed-variant": "#1f5100", "outline-variant": "#becbb1", "surface": "#f3faff", "secondary": "#006590", "tertiary-fixed": "#ffdf92", "surface-container-high": "#ddeaf1", "primary-fixed": "#87fe45", "primary-container": "#58cc02", "on-secondary-container": "#004666", "on-secondary": "#ffffff", "on-secondary-fixed": "#001e2e", "on-primary-fixed": "#082100", "error": "#ba1a1a", "outline": "#6f7b64" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xl": "2rem", "gutter": "1rem", "margin": "1.5rem", "space-xs": "0.25rem", "gutter-mobile": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem", "margin-mobile": "1rem" }, fontFamily: { "headline-lg": ["Rubik"], "body-md": ["Rubik"], "label-md": ["Rubik"], "display-hero": ["Rubik"], "label-lg": ["Rubik"], "body-sm": ["Rubik"], "label-sm": ["Rubik"], "body-lg": ["Rubik"], "headline-lg-mobile": ["Rubik"], "headline-sm": ["Rubik"], "headline-md": ["Rubik"] }, fontSize: { "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "800" }], "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "800" }], "display-hero": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "900" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.05em", "fontWeight": "800" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "800" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "fontWeight": "800" }] } } } }</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-fixed bg-surface-container-lowest"><main class="flex flex-col items-center justify-center min-h-screen relative w-full max-w-lg mx-auto p-gutter-mobile bg-surface-container-lowest"><div class="flex flex-col w-full items-center justify-center py-space-sm">
<div class="w-full max-w-sm flex flex-col gap-space-md">
<!-- Header Status Bar Contextual -->
<div class="flex items-center justify-between px-space-xs">
<div class="inline-flex items-center gap-space-xs bg-surface-container-high text-on-surface px-space-sm py-1 rounded-full shadow-sm">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-md text-label-md uppercase tracking-wider text-primary">English Up SENA</span>
</div>
<div class="inline-flex items-center gap-1 bg-surface-container-lowest text-tertiary px-space-sm py-1 rounded-full shadow-sm">


</div>
</div>
<!-- Main Arcade Timer Card -->
<div class="relative w-full bg-surface-container-lowest rounded-xl p-space-md flex flex-col items-center gap-space-md shadow-xl overflow-hidden transition-all duration-300">
<!-- Top Extrusion Indicator Strip -->
<div class="absolute top-0 inset-x-0 h-2 bg-gradient-to-r from-primary-container via-secondary-container to-primary-container opacity-90"></div>
<!-- Header inside card -->

<!-- Circular SVG Radial Countdown -->
<div class="relative flex items-center justify-center my-space-xs">
<!-- Pulse halo for critical time -->
<div class="absolute w-44 h-44 rounded-full bg-error-container transition-opacity duration-300 pointer-events-none opacity-40 opacity-30" id="dangerGlow"></div>
<svg class="w-52 h-52 -rotate-90 transform" viewBox="0 0 200 200">
<defs>
<linearGradient id="timerSenaGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#58cc02"></stop>
<stop offset="100%" stop-color="#2b6c00"></stop>
</linearGradient>
<linearGradient id="timerWarnGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ddad00"></stop>
<stop offset="100%" stop-color="#755b00"></stop>
</linearGradient>
<linearGradient id="timerAlertGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ba1a1a"></stop>
<stop offset="100%" stop-color="#93000a"></stop>
</linearGradient>
</defs>
<!-- Outer tactile bezel ring -->
<circle cx="100" cy="100" fill="none" r="86" stroke="#e3f0f7" stroke-width="16"></circle>
<!-- Dynamic Active Progress Arc -->
<circle class="transition-all duration-150 ease-linear" cx="100" cy="100" fill="none" id="timerCircle" r="86" stroke="url(#timerSenaGrad)" stroke-dasharray="540.35" stroke-dashoffset="0" stroke-linecap="round" stroke-width="14" style="stroke-dashoffset: 540.354;"></circle>
</svg>
<!-- Center Counter Display -->
<div class="absolute inset-0 flex flex-col items-center justify-center select-none">
<div class="flex items-baseline justify-center">
<span class="font-display-hero text-display-hero tracking-tight font-black tabular-nums transition-transform duration-200 text-on-surface" id="timerSeconds">0</span>
<span class="font-label-md text-label-md text-on-surface-variant font-bold ml-1">s</span>
</div>
<div class="flex items-center gap-1 mt-0.5">
<span class="font-label-sm text-label-sm uppercase tracking-widest px-2 py-0.5 rounded-full font-bold bg-surface-container text-on-surface-variant" id="timerSubtext">¡TIEMPO AGOTADO!</span>
</div>
</div>
</div>
<!-- Speed Bonus Meter (Tactile chunk) -->
<div class="w-full bg-surface-container-low rounded-lg p-space-sm flex flex-col gap-1.5 shadow-sm">
<div class="flex items-center justify-between text-on-surface">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-tertiary-container" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-sm text-label-sm text-on-surface font-extrabold uppercase">Velocidad extra</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-black" id="bonusPtsDisplay">+0 PTS</span>
</div>
<!-- Chunk progress bar -->
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden p-0.5 flex">
<div class="h-full bg-primary-container rounded-full transition-all duration-200 w-full relative" id="bonusBar" style="width: 0%;">
<div class="absolute inset-x-0 top-0 h-1 bg-white/40 rounded-full"></div>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center text-xs">¡Responde antes de que la bonificación caiga a cero!</p>
</div>
<!-- Interactive Controls (Chunky Tactile Neo-Brutalist Buttons) -->
<div class="w-full grid grid-cols-2 gap-space-sm pt-space-xs">
<!-- Pause / Resume Button -->
<button class="h-12 rounded-full font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 bg-secondary text-on-secondary shadow-md active:translate-y-1 transition-all" id="btnTogglePause" type="button">
<span class="material-symbols-outlined text-lg" id="pauseIcon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span id="pauseLabel" class="">PAUSAR</span>
</button>
<!-- Reset Button -->
<button class="h-12 rounded-full font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 bg-surface-container text-on-surface shadow-md active:translate-y-1 transition-all hover:bg-surface-variant" id="btnReset" type="button">
<span class="material-symbols-outlined text-lg">restart_alt</span>
<span class="">REINICIAR</span>
</button>
</div>
<!-- Time Quick Selection Selector -->
<div class="flex items-center justify-center gap-space-xs w-full pt-space-xs border-t-0">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Ronda:</span>
<button class="px-space-sm py-1 rounded-full text-label-sm font-label-sm bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors" id="set15s">15s</button>
<button class="px-space-sm py-1 rounded-full text-label-sm font-label-sm bg-primary text-on-primary font-bold shadow-sm transition-colors" id="set20s">20s (Default)</button>
<button class="px-space-sm py-1 rounded-full text-label-sm font-label-sm bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors" id="set30s">30s</button>
</div>
</div>
<!-- Mini gamified tip card -->

</div>
</div>
<script>
  (function () {
    const RADIUS = 86;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let totalDuration = 20; // seconds
    let remainingTime = 20; // seconds
    let isPaused = false;
    let timerInterval = null;

    const timerCircle = document.getElementById('timerCircle');
    const timerSeconds = document.getElementById('timerSeconds');
    const timerSubtext = document.getElementById('timerSubtext');
    const bonusPtsDisplay = document.getElementById('bonusPtsDisplay');
    const bonusBar = document.getElementById('bonusBar');
    const dangerGlow = document.getElementById('dangerGlow');
    const btnTogglePause = document.getElementById('btnTogglePause');
    const pauseLabel = document.getElementById('pauseLabel');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnReset = document.getElementById('btnReset');
    const syncStatusBadge = document.getElementById('syncStatusBadge');

    const set15s = document.getElementById('set15s');
    const set20s = document.getElementById('set20s');
    const set30s = document.getElementById('set30s');

    function updateRoundPills(activeBtn) {
      [set15s, set20s, set30s].forEach((btn) => {
        btn.classList.remove('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
        btn.classList.add('bg-surface-container', 'text-on-surface');
      });
      activeBtn.classList.remove('bg-surface-container', 'text-on-surface');
      activeBtn.classList.add('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
    }

    function renderDisplay() {
      const roundedSeconds = Math.max(0, Math.ceil(remainingTime));
      timerSeconds.textContent = roundedSeconds;

      const progress = Math.max(0, remainingTime / totalDuration);
      const strokeOffset = CIRCUMFERENCE * (1 - progress);
      timerCircle.style.strokeDashoffset = strokeOffset;

      // Calculate speed bonus points (max 1000)
      const currentBonus = Math.max(0, Math.round(progress * 1000));
      bonusPtsDisplay.textContent = `+${currentBonus.toLocaleString()} PTS`;
      bonusBar.style.width = `${progress * 100}%`;

      // Visual color shifts based on urgency
      if (remainingTime <= 5 && remainingTime > 0) {
        timerCircle.setAttribute('stroke', 'url(#timerAlertGrad)');
        timerSeconds.classList.add('text-error');
        timerSeconds.classList.remove('text-on-surface', 'text-tertiary');
        dangerGlow.classList.remove('opacity-0');
        dangerGlow.classList.add('opacity-40', 'animate-ping');
        timerSubtext.textContent = '¡RÁPIDO!';
        timerSubtext.classList.add('bg-error-container', 'text-on-error-container');
        timerSubtext.classList.remove('bg-surface-container', 'text-on-surface-variant');
      } else if (remainingTime <= 10 && remainingTime > 5) {
        timerCircle.setAttribute('stroke', 'url(#timerWarnGrad)');
        timerSeconds.classList.remove('text-error', 'text-on-surface');
        timerSeconds.classList.add('text-tertiary');
        dangerGlow.classList.remove('animate-ping');
        dangerGlow.classList.add('opacity-0');
        timerSubtext.textContent = 'TIEMPO MEDIO';
        timerSubtext.classList.remove('bg-error-container', 'text-on-error-container');
        timerSubtext.classList.add('bg-surface-container', 'text-on-surface-variant');
      } else {
        timerCircle.setAttribute('stroke', 'url(#timerSenaGrad)');
        timerSeconds.classList.remove('text-error', 'text-tertiary');
        timerSeconds.classList.add('text-on-surface');
        dangerGlow.classList.remove('animate-ping');
        dangerGlow.classList.add('opacity-0');
        timerSubtext.textContent = 'SECONDS';
        timerSubtext.classList.remove('bg-error-container', 'text-on-error-container');
        timerSubtext.classList.add('bg-surface-container', 'text-on-surface-variant');
      }

      if (remainingTime <= 0) {
        timerSubtext.textContent = '¡TIEMPO AGOTADO!';
        dangerGlow.classList.remove('animate-ping');
        dangerGlow.classList.remove('opacity-0');
        dangerGlow.classList.add('opacity-30');
      }
    }

    function tick() {
      if (isPaused) return;

      const step = 0.1;
      remainingTime = Math.max(0, remainingTime - step);
      renderDisplay();

      if (remainingTime <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(tick, 100);
    }

    function resetTimer(newDuration = totalDuration) {
      totalDuration = newDuration;
      remainingTime = newDuration;
      isPaused = false;
      pauseLabel.textContent = 'PAUSAR';
      pauseIcon.textContent = 'pause';
      syncStatusBadge.textContent = `LIVE SYNC • ${totalDuration}s`;
      renderDisplay();
      startTimer();
    }

    // Controls listeners
    btnTogglePause.addEventListener('click', () => {
      if (remainingTime <= 0) {
        resetTimer(totalDuration);
        return;
      }
      isPaused = !isPaused;
      if (isPaused) {
        pauseLabel.textContent = 'REANUDAR';
        pauseIcon.textContent = 'play_arrow';
      } else {
        pauseLabel.textContent = 'PAUSAR';
        pauseIcon.textContent = 'pause';
      }
    });

    btnReset.addEventListener('click', () => {
      resetTimer(totalDuration);
    });

    set15s.addEventListener('click', () => {
      updateRoundPills(set15s);
      resetTimer(15);
    });

    set20s.addEventListener('click', () => {
      updateRoundPills(set20s);
      resetTimer(20);
    });

    set30s.addEventListener('click', () => {
      updateRoundPills(set30s);
      resetTimer(30);
    });

    // Check prefers-reduced-motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      timerCircle.classList.remove('transition-all');
      dangerGlow.classList.remove('animate-ping');
    }

    // Initialize
    resetTimer(20);
  })();
</script></main>
