# ==========================================
# Perfil H2: Base de datos en memoria para pruebas locales inmediatas
# Uso: spring.profiles.active=h2 (o -Dspring.profiles.active=h2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:english_day_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola web H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
