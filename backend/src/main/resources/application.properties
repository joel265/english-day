spring.application.name=english-day
server.port=8080

# ==========================================
# Configuración Base de Datos (MySQL 8.0+)
# Definido en Bitácora de Decisiones Técnicas (Decisión #4)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/english_day?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
