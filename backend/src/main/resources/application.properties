spring.application.name=english-day
server.port=8080

# Configuracion de conexion MySQL (XAMPP / Local) - Bitacora #4
spring.datasource.url=jdbc:mysql://localhost:3306/english_day?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estrategia de nombres fisicos exacta para respetar camelCase de BD (roomId, createdAt, etc.)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Soporte para Reverse Proxy (Cloudflare Tunnel: X-Forwarded-Proto, X-Forwarded-For, etc.)
server.forward-headers-strategy=framework
