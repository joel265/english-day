# ==========================================
# Perfil de Producción (Manual de Despliegue Paso 2: -Dspring.profiles.active=prod)
# ==========================================
spring.application.name=english-day
server.port=${PORT:8080}

# Conexión MySQL 8.0+ (Configurable por variables de entorno o valores locales por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/english_day?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optimización de JPA/Hibernate para evento en vivo (30-50 dispositivos concurrentes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Soporte para Cloudflare Tunnel (HTTPS / WSS)
server.forward-headers-strategy=framework
